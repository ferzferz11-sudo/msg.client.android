<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavender Messenger — Download</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #e0d4f5;
}
.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 24px;
  padding: 48px 40px;
  max-width: 420px;
  width: 90%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}
.logo {
  font-size: 56px;
  margin-bottom: 12px;
}
h1 {
  font-size: 28px;
  font-weight: 700;
  color: #c4aef8;
  margin-bottom: 6px;
}
.version {
  font-size: 15px;
  color: #a78fda;
  margin-bottom: 32px;
  font-family: monospace;
}
.btn {
  display: block;
  width: 100%;
  padding: 16px;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  color: #fff;
  box-shadow: 0 4px 20px rgba(124,58,237,0.35);
  margin-bottom: 14px;
}
.btn-primary:hover { box-shadow: 0 6px 28px rgba(124,58,237,0.5); }
.btn-secondary {
  background: rgba(255,255,255,0.08);
  color: #c4aef8;
  border: 1px solid rgba(196,174,248,0.25);
}
.links {
  margin-top: 28px;
  display: flex;
  gap: 16px;
  justify-content: center;
}
.links a {
  color: #9b82cc;
  text-decoration: none;
  font-size: 13px;
  transition: color 0.2s;
}
.links a:hover { color: #c4aef8; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">💬</div>
  <h1>Lavender Messenger</h1>
  <div class="version" id="ver">Загрузка...</div>
  <a href="/download" class="btn btn-primary">⬇ Скачать APK</a>
  <a href="/changelog.txt" class="btn btn-secondary">📋 Changelog</a>
  <div class="links">
    <a href="/version.txt">version.txt</a>
    <a href="https://github.com/ferzferz11-sudo/msg">GitHub</a>
  </div>
</div>
<script>
fetch('/version.txt')
  .then(r => r.text())
  .then(v => { document.getElementById('ver').textContent = 'v' + v.trim(); })
  .catch(() => { document.getElementById('ver').textContent = 'v?.?.?.?'; });
</script>
</body>
</html>
